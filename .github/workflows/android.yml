
name: Build StepLab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          unzip -o StepLab-Android-Project.zip

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find . \
            -type f \
            -name settings.gradle.kts \
            -not -path '*/.gradle/*' \
            -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          echo "Found project: $PROJECT_DIR"

      - name: Fix Java and Kotlin JVM target
        run: |
          FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: app/build.gradle.kts not found"
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r") as f:
              content = f.read()

          if "compileOptions" not in content:
              content = content.replace(
                  "    compileSdk = 35",
                  """    compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }"""
              )

          with open(path, "w") as f:
              f.write(content)

          print("Java/Kotlin target configuration:")
          print(content)
          PY

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK successfully created!"
          ls -lh "$APK"

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: StepLab-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
